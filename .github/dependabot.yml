version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    groups:
      root-dependencies:
        patterns:
          - "*"
    ignore:
      - dependency-name: typescript
        update-types:
          - version-update:semver-major
      - dependency-name: jsdom
        update-types:
          - version-update:semver-major
  - package-ecosystem: npm
    directory: /mcp
    schedule:
      interval: weekly
    groups:
      mcp-dependencies:
        patterns:
          - "*"
    ignore:
      - dependency-name: typescript
        update-types:
          - version-update:semver-major
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns:
          - "*"
