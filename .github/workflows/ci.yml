name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [22]

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Audit dependencies
        run: npm audit --audit-level=high

      - name: Check versions
        run: npm run check:versions

      - name: Lint
        run: npm run lint

      - name: Run tests
        run: npm test

      - name: Build production
        run: npm run build

      - name: Install MCP dependencies
        working-directory: mcp
        run: npm ci

      - name: Audit MCP dependencies
        working-directory: mcp
        run: npm audit --audit-level=high

      - name: Test MCP server
        working-directory: mcp
        run: npm test

      - name: Build MCP server
        working-directory: mcp
        run: npm run build

      - name: Check dist size
        run: |
          echo "## Build output" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          du -sh dist/
          ls -lh dist/*.js dist/*.css | awk '{print $5, $9}' >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY

      - name: Upload extension artifact
        uses: actions/upload-artifact@v4
        with:
          name: spector-gpu-extension
          path: dist/
          retention-days: 30

  local-fixture-e2e:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build production
        run: npm run build

      - name: Install Chrome and system dependencies
        run: npx playwright install --with-deps chrome

      - name: Run local WebGPU fixtures
        run: >-
          xvfb-run --auto-servernum npm run test:e2e --
          test/e2e/triangle-capture.spec.ts
          test/e2e/compute-capture.spec.ts
          test/e2e/multi-pass-capture.spec.ts
          test/e2e/no-webgpu.spec.ts
          test/e2e/capture-quality.spec.ts

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 14
